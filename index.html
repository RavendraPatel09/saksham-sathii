<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Saksham Sathi — Saath Chalenge, Aage Badhenge | Accessibility & Career Platform</title>
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('saksham_accessibility_prefs');
          if (saved) {
            const prefs = JSON.parse(saved);
            if (prefs && (prefs.darkMode || prefs.highContrast || (prefs.profile && prefs.profile.visual))) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
