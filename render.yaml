services:
  - type: web
    name: saksham-sathi-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://saksham-sathi-backend.onrender.com/api/v1

  - type: web
    name: saksham-sathi-backend
    runtime: node
    buildCommand: npm --prefix apps/api install && npm --prefix apps/api run build
    startCommand: npm --prefix apps/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://saksham-sathi-frontend.onrender.com,http://localhost:5173
